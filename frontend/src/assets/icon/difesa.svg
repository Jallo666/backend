<svg width="64" height="64" viewBox="0 0 64 64"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Fondo trasparente -->
  <rect x="0" y="0" width="64" height="64" fill="none"/>

  <!-- Scudo: bordo esterno -->
  <path d="
    M32 6
    L48 14
    L48 30
    C48 40 41 49 32 54
    C23 49 16 40 16 30
    L16 14
    Z"
    fill="#C0C4CC"
    stroke="#2B2B2B"
    stroke-width="2"
    stroke-linejoin="round"/>

  <!-- Interno leggermente più scuro -->
  <path d="
    M32 9
    L45 16
    L45 30
    C45 38 39 46 32 50
    C25 46 19 38 19 30
    L19 16
    Z"
    fill="#9DA2AA"
    stroke="#2B2B2B"
    stroke-width="1.5"
    stroke-linejoin="round"/>

  <!-- Croce centrale / rinforzo -->
  <line x1="32" y1="16" x2="32" y2="44"
        stroke="#2B2B2B" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="30" x2="40" y2="30"
        stroke="#2B2B2B" stroke-width="2" stroke-linecap="round"/>

  <!-- Borchia centrale arancione (richiamo al pomolo della spada) -->
  <circle cx="32" cy="30" r="3.5"
          fill="#F29B38"
          stroke="#2B2B2B"
          stroke-width="1.5"/>
</svg>