<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Lama -->
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>

    <!-- Fiamma -->
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- SPADA + FIAMME (inclinata per dinamismo) -->
  <g transform="translate(32 32) rotate(-35) translate(-32 -32)">
    
    <!-- Fiamma -->
    <path
      d="M34 14
         C 30 18, 29 23, 31 27
         C 28 30, 28 34, 31 37
         C 29 39, 30 42, 33 43
         C 36 42, 37 39, 35 37
         C 38 34, 38 30, 35 27
         C 37 23, 36 18, 34 14 Z"
      fill="url(#flame)"
      stroke="#fed7aa"
      stroke-width="1.4"
      stroke-linejoin="round"
    />

    <!-- Lama -->
    <path
      d="M33 14
         L 30 20
         L 30 36
         Q 33 38 36 36
         L 36 20
         Z"
      fill="url(#blade)"
      stroke="#111827"
      stroke-width="1.6"
      stroke-linejoin="round"
    />

    <!-- Linea centrale -->
    <line x1="33" y1="18" x2="33" y2="34"
          stroke="#e5e7eb" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Guardamano -->
    <rect x="26" y="35" width="14" height="4" rx="2" ry="2"
          fill="#92400e" stroke="#451a03" stroke-width="1.4"/>

    <!-- Impugnatura -->
    <rect x="31" y="39" width="4" height="8" rx="1.5" ry="1.5"
          fill="#1f2937" stroke="#020617" stroke-width="1.4"/>

    <!-- Pomolo -->
    <circle cx="33" cy="48" r="3.2"
            fill="#fbbf24" stroke="#78350f" stroke-width="1.4"/>
  </g>

</svg>