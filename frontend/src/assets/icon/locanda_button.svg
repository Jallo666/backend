<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Sfondo opzionale del bottone (puoi toglierlo) -->
  <rect x="2" y="2" width="60" height="60" rx="10" ry="10" fill="#2b1a12"/>

  <!-- Corpo della locanda -->
  <rect x="10" y="24" width="44" height="26" fill="#8b5a2b" stroke="#3b2414" stroke-width="2"/>
  <!-- Porta -->
  <rect x="28" y="32" width="8" height="18" fill="#3b2414"/>
  <circle cx="34" cy="41" r="1.2" fill="#d9b37c"/>

  <!-- Finestre -->
  <rect x="16" y="30" width="6" height="6" fill="#f6d27b"/>
  <rect x="42" y="30" width="6" height="6" fill="#f6d27b"/>

  <!-- Tetto -->
  <polygon points="8,24 32,10 56,24" fill="#5a2b1a" stroke="#2b140c" stroke-width="2"/>

  <!-- Insegna appesa (boccale di birra stilizzato) -->
  <line x1="44" y1="26" x2="54" y2="26" stroke="#d9b37c" stroke-width="2"/>
  <line x1="54" y1="26" x2="54" y2="34" stroke="#d9b37c" stroke-width="2"/>

  <rect x="48" y="30" width="8" height="8" rx="1.5" fill="#3b2414" stroke="#d9b37c" stroke-width="1.5"/>
  <!-- Boccale -->
  <rect x="50" y="32" width="4" height="4" fill="#f6d27b"/>
  <rect x="54" y="33" width="1.5" height="2.5" fill="#f6d27b"/>
  <!-- Schiuma -->
  <circle cx="51" cy="32" r="1" fill="#fff7d6"/>
  <circle cx="53" cy="32" r="1" fill="#fff7d6"/>

  <!-- Base / terreno -->
  <rect x="8" y="50" width="48" height="3" fill="#3b2414" opacity="0.9"/>
</svg>